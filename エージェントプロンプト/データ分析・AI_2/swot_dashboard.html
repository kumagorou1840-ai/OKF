<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>戦略SWOT優先度ダッシュボード</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6">
  <div class="max-w-6xl mx-auto space-y-6">
    <header class="border-b border-slate-800 pb-4">
      <h1 class="text-2xl font-bold tracking-tight text-emerald-400">戦略SWOT優先度ダッシュボード</h1>
      <p class="text-xs text-slate-400 mt-1">SQLite -> DecideFlow -> ml-plotly-dash-helper -> HTML5 パイプライン連携</p>
    </header>

    <div class="bg-slate-900 border border-slate-800 rounded-lg p-4 shadow">
      <div id="bubbleChart" style="height: 480px;"></div>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-lg p-4 shadow">
      <h2 class="text-sm font-semibold text-slate-300 mb-3">導出クロス戦略一覧</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-xs text-left border-collapse">
          <thead>
            <tr class="border-b border-slate-800 text-slate-400">
              <th class="py-2 px-3">区分</th>
              <th class="py-2 px-3">施策名</th>
              <th class="py-2 px-3 text-center">期待収益 (1-10)</th>
              <th class="py-2 px-3 text-center">実行難易度 (1-10)</th>
              <th class="py-2 px-3 text-center">想定予算</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-800">
            <tr><td class="py-2 px-3 font-semibold text-emerald-400">SO</td><td class="py-2 px-3">空き家再生×体験型宿泊施設展開</td><td class="py-2 px-3 text-center">9.2</td><td class="py-2 px-3 text-center">4.5</td><td class="py-2 px-3 text-center">800万円</td></tr>
            <tr><td class="py-2 px-3 font-semibold text-emerald-400">SO</td><td class="py-2 px-3">管理オーナー向け独占オウンドメディア</td><td class="py-2 px-3 text-center">8.4</td><td class="py-2 px-3 text-center">3.8</td><td class="py-2 px-3 text-center">350万円</td></tr>
            <tr><td class="py-2 px-3 font-semibold text-sky-400">WO</td><td class="py-2 px-3">賃貸仲介自動化・内見Bot導入</td><td class="py-2 px-3 text-center">7.5</td><td class="py-2 px-3 text-center">5.2</td><td class="py-2 px-3 text-center">450万円</td></tr>
            <tr><td class="py-2 px-3 font-semibold text-amber-400">ST</td><td class="py-2 px-3">大手ポータル非掲載プレミアム物件独占</td><td class="py-2 px-3 text-center">8.8</td><td class="py-2 px-3 text-center">6.0</td><td class="py-2 px-3 text-center">500万円</td></tr>
            <tr><td class="py-2 px-3 font-semibold text-rose-400">WT</td><td class="py-2 px-3">不採算エリア統廃合・外部委託</td><td class="py-2 px-3 text-center">5.0</td><td class="py-2 px-3 text-center">2.5</td><td class="py-2 px-3 text-center">150万円</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const data = [{
      x: [4.5, 3.8, 5.2, 6.0, 2.5],
      y: [9.2, 8.4, 7.5, 8.8, 5.0],
      text: [
        "【SO】空き家再生宿泊施設<br>収益: 9.2 / 難易度: 4.5<br>予算: 800万円",
        "【SO】オーナー向けメディア<br>収益: 8.4 / 難易度: 3.8<br>予算: 350万円",
        "【WO】仲介自動化Bot<br>収益: 7.5 / 難易度: 5.2<br>予算: 450万円",
        "【ST】プレミアム物件独占<br>収益: 8.8 / 難易度: 6.0<br>予算: 500万円",
        "【WT】不採算エリア統廃合<br>収益: 5.0 / 難易度: 2.5<br>予算: 150万円"
      ],
      mode: 'markers+text',
      textposition: 'top center',
      textfont: { size: 10, color: '#94a3b8' },
      marker: {
        size: [80, 55, 60, 65, 35],
        color: ['#10b981', '#10b981', '#38bdf8', '#fbbf24', '#f43f5e'],
        opacity: 0.85,
        line: { color: '#ffffff', width: 1.5 }
      }
    }];

    const layout = {
      paper_bgcolor: '#0f172a',
      plot_bgcolor: '#0f172a',
      xaxis: { title: '実行難易度 (低 -> 高)', range: [1, 9], gridcolor: '#1e293b', tickfont: { color: '#94a3b8' } },
      yaxis: { title: '期待収益インパクト (低 -> 高)', range: [3, 11], gridcolor: '#1e293b', tickfont: { color: '#94a3b8' } },
      shapes: [
        { type: 'line', x0: 5, x1: 5, y0: 3, y1: 11, line: { color: '#475569', dash: 'dot' } },
        { type: 'line', x0: 1, x1: 9, y0: 7, y1: 7, line: { color: '#475569', dash: 'dot' } }
      ],
      annotations: [
        { x: 2.5, y: 10.3, text: '★ 最優先着手 (Quick Win)', showarrow: false, font: { color: '#34d399', size: 12 } },
        { x: 7.5, y: 10.3, text: '重点投資領域 (Strategic)', showarrow: false, font: { color: '#fbbf24', size: 12 } }
      ],
      margin: { t: 40, b: 40, l: 50, r: 30 }
    };

    Plotly.newPlot('bubbleChart', data, layout, { responsive: true, displayModeBar: false });
  </script>
</body>
</html>
